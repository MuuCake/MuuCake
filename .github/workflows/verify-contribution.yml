name: Verify Daily Profile Contribution

on:
  schedule:
    # 05:37 UTC: check today and yesterday
    - cron: '37 5 * * *'
    # 10:37 UTC: check and dispatch one recovery if today's commit is missing
    - cron: '37 10 * * *'
    # 11:17 UTC: recheck after a possible recovery
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      target_day:
        description: 'UTC date YYYY-MM-DD (empty = today)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: verify-profile-contribution
  cancel-in-progress: false

jobs:
  verify-today:
    name: Check target UTC date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.audit.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify snapshot and contribution data
        id: audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DAY: ${{ inputs.target_day }}
        run: python scripts/verify_contribution.py
      - name: Mark verification error
        if: ${{ steps.audit.outcome == 'failure' }}
        run: exit 1

  verify-yesterday:
    name: Independently verify previous UTC day
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify yesterday
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_DAY="$(date -u -d yesterday +%F)" python scripts/verify_contribution.py

  recover-today:
    name: Trigger one recovery attempt
    needs: verify-today
    if: ${{ always() && github.event_name == 'schedule' && github.event.schedule == '37 10 * * *' && needs.verify-today.outputs.status == 'MISSING_COMMIT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch daily snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run daily-stats.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo '### Recovery dispatched' >> "$GITHUB_STEP_SUMMARY"
          echo 'Requested one Daily GitHub Project Snapshot run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The 11:17 UTC verification will check for the new commit.' >> "$GITHUB_STEP_SUMMARY"
