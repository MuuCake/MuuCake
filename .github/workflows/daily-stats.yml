
name: Daily GitHub Project Snapshot


on:
  schedule:
    # 09:05 - 09:55 KST, every 5 minutes
    - cron: '5-55/5 0 * * *'

    # Backup: 12:17 and 18:17 KST
    - cron: '17 3,9 * * *'


  # Allow manual testing
  workflow_dispatch:

# Permission to push commits
permissions:
  contents: write

# Prevent simultaneous updates
concurrency:
  group: daily-project-snapshot-main
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Checkout latest main branch
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      # Generate daily statistics
      - name: Update daily statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/daily_stats.py

      # Commit only if the file changed
      - name: Commit daily update
        env:
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          if [ -z "$COMMIT_EMAIL" ]; then
            echo "COMMIT_EMAIL is missing"
            exit 1
          fi

          git config user.name "MuuCake"
          git config user.email "$COMMIT_EMAIL"

          git add activity/latest.md

          if git diff --cached --quiet; then
            echo "No changes needed today"
            echo "### ✅ Already updated today" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "docs: update daily GitHub stats"
          git push origin HEAD:main

          echo "Daily snapshot committed successfully"
          echo "### ✅ Committed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
