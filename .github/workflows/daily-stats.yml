
name: Daily GitHub Project Snapshot

on:
  schedule:
    # 09:05 - 09:55 KST, every 5 minutes
    - cron: '5-55/5 0 * * *'

    # Backup: 12:17 and 18:17 KST
    - cron: '17 3,9 * * *'

  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-project-snapshot-main
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Checkout latest main
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      # Update real project statistics
      - name: Update daily statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/daily_stats.py

      # Commit only when the file changes
      - name: Commit daily update
        id: commit
        env:
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "$COMMIT_EMAIL" ]; then
            echo "::error::COMMIT_EMAIL is missing"
            exit 1
          fi

          git config user.name "MuuCake"
          git config user.email "$COMMIT_EMAIL"

          git add activity/latest.md

          if git diff --cached --quiet; then
            echo "No changes needed today"
            echo "### ✅ Already updated today" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "docs: update daily GitHub stats"
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

          echo "Daily snapshot committed successfully"
          echo "### ✅ Committed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # Trigger Sakura Snake only after a new commit
      - name: Trigger Sakura Snake
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run snake.yml \
            --ref main \
            --repo "$GITHUB_REPOSITORY"

          echo "### 🌸 Sakura Snake triggered" >> "$GITHUB_STEP_SUMMARY"
